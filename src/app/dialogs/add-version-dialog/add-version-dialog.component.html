<h2 mat-dialog-title>Neues Ziel</h2>
<mat-dialog-content>
  <p>Der Kurzlink zeigt danach auf die neue Adresse. Bisher führt er zu:</p>
  <p class="current mono">{{ link }}</p>

  <form [formGroup]="event" (ngSubmit)="saveFnc()" id="add-version-form">
    <mat-form-field>
      <mat-label>Neue Adresse</mat-label>
      <input formControlName="link"
        class="mono"
        type="url"
        inputmode="url"
        placeholder="https://…"
        cdkFocusInitial
        matInput>
      <mat-error>{{ getLinkErrorMessage() }}</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close type="button">Abbrechen</button>
  <button mat-flat-button type="submit" form="add-version-form">Ziel ändern</button>
</mat-dialog-actions>
