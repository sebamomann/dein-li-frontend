<div class="chart">
  <div class="plot">
    <canvas #canvas role="img" aria-label="Aufrufe im gewählten Zeitraum"></canvas>
    @if (!stats) {
      <div class="state" role="status">Aufrufe werden geladen …</div>
    } @else if (!stats.total) {
      <div class="state">Noch keine Aufrufe in diesem Zeitraum</div>
    }
  </div>

  <dl class="totals">
    <div>
      <dt>Aufrufe</dt>
      <dd class="num">{{ stats?.total ? (stats.total | number) : '0' }}</dd>
    </div>
    <div>
      <dt>Geräte</dt>
      <dd class="num">{{ stats?.distinctCalls ? (stats.distinctCalls | number) : '0' }}</dd>
    </div>
  </dl>
</div>
