@if (refreshing) {
  <span class="refreshing" role="status" aria-label="Anmeldung wird geprüft">
    <mat-icon class="spin">sync</mat-icon>
  </span>
} @else if (userIsLoggedIn) {
  <button mat-stroked-button class="account" [matMenuTriggerFor]="menu" #menuTrigger="matMenuTrigger">
    <span class="avatar" aria-hidden="true">{{ (username || '?').charAt(0).toUpperCase() }}</span>
    <span class="name">{{ username }}</span>
    <mat-icon class="chev">expand_more</mat-icon>
  </button>
} @else {
  <button mat-stroked-button class="login" (click)="login()">
    <mat-icon>login</mat-icon>
    Anmelden
  </button>
}

<mat-menu #menu="matMenu" xPosition="before">
  <button mat-menu-item [routerLink]="['/link/overview']">
    <mat-icon>link</mat-icon>
    Meine Links
  </button>
  <button mat-menu-item (click)="openAccountSettings()">
    <mat-icon>person</mat-icon>
    Konto verwalten
  </button>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    Abmelden
  </button>
</mat-menu>
