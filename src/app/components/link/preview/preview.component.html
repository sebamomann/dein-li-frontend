<article class="notice preview">
  @if ($link | async; as link) {
    <h1 class="dest">
      <span class="star-point" aria-hidden="true"></span>
      <span>{{ domainOf(link.original) }}</span>
    </h1>
    <p class="from">Ziel von <span class="short-label"><span class="base">dein.li/</span>{{ link.short }}</span></p>

    <div class="url panel mono">{{ link.original }}</div>

    <p class="meta">Erstellt am {{ link.iat | date: 'dd.MM.yyyy' }} um {{ link.iat | date: 'HH:mm' }} Uhr. Prüfe die Adresse, bevor du weitergehst.</p>

    <div class="actions">
      <button mat-flat-button
        cdkFocusInitial
        #btnRef
        (click)="openLinkInSameTab(link.short)">
        Link öffnen
        <mat-icon iconPositionEnd>arrow_forward</mat-icon>
      </button>
      <button mat-stroked-button (click)="redirectToHome()">Zurück</button>
    </div>

    <div class="report">
      <app-report-block [short]="link.short"></app-report-block>
    </div>
  } @else {
    <p class="from loading" role="status">Ziel wird geladen …</p>
    <div class="skeleton" aria-hidden="true"></div>
  }
</article>
